<title>Sozialräume Lahn-Dill-Kreis – Anmeldung</title>
<style>
:root { --fg: #1a1a1a; --muted: #5c5f66; --bg: #f4f6f9; --line: #dde2ea; --blau: #4f81a5; --blau-dunkel: #36607f; --hellblau: #8cbce0; --orange: #ee5d05;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; color-scheme: light; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg); font: 15px/1.45 var(--font); padding: 16px; }
.box { width: 100%; max-width: 380px; background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.head { background: linear-gradient(135deg, var(--blau) 0%, var(--blau-dunkel) 100%); color: #fff; padding: 18px 20px 14px; border-bottom: 6px solid var(--hellblau); }
.head .k { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; opacity: .85; }
.head h1 { margin: 4px 0 0; font-size: 20px; line-height: 1.25; }
form { padding: 20px; display: grid; gap: 12px; }
label { font-weight: 600; font-size: 14px; }
input[type=password] { width: 100%; padding: 10px 12px; font: inherit; border: 1px solid var(--line); border-radius: 6px; }
input[type=password]:focus { outline: 2px solid var(--blau); outline-offset: 1px; }
.merken { display: flex; gap: 8px; align-items: center; font-size: 14px; color: var(--muted); }
button { padding: 10px 14px; font: inherit; font-weight: 600; color: #fff; background: var(--blau-dunkel); border: 0; border-radius: 6px; cursor: pointer; }
button:disabled { opacity: .6; cursor: wait; }
button:focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; }
.fehler { color: #b3261e; font-size: 14px; min-height: 1.2em; margin: 0; }
.hinweis { font-size: 13px; color: var(--muted); margin: 0; }
.hinweis a { color: var(--blau-dunkel); }
</style>
</head>
<body>
<div class="box">
  <div class="head"><div class="k">Bildungsbüro Lahn-Dill-Kreis</div><h1>Sozialräume: Bedarfe und Angebote</h1></div>
  <form id="f" autocomplete="on">
    <input type="text" name="username" value="sozialraum-ldk" autocomplete="username" hidden>
    <label for="pw">Passwort</label>
    <input type="password" id="pw" name="password" autocomplete="current-password" required autofocus>
    <label class="merken"><input type="checkbox" id="merken"> Auf diesem Gerät angemeldet bleiben</label>
    <button type="submit" id="los">Öffnen</button>
    <p class="fehler" id="fehler" role="alert"></p>
    <p class="hinweis">Kein Passwort? Bitte beim <a href="https://bildungslandschaft.schulen-ldk.de/bildungsbuero/" target="_blank" rel="noopener">Bildungsbüro des Lahn-Dill-Kreises</a> anfragen.</p>
  </form>
</div>

  const SPEICHER = 'sozialraum-schluessel';
  const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const roh = (u8) => btoa(String.fromCharCode.apply(null, u8));

  function lies(k) { try { return sessionStorage.getItem(k) || localStorage.getItem(k); } catch (e) { return null; } }
  function merke(k, v, dauerhaft) { try { sessionStorage.setItem(k, v); if (dauerhaft) localStorage.setItem(k, v); } catch (e) {} }
  function vergiss(k) { try { sessionStorage.removeItem(k); localStorage.removeItem(k); } catch (e) {} }

  async function oeffne(schluesselRoh) {
    const key = await crypto.subtle.importKey('raw', schluesselRoh, 'AES-GCM', false, ['decrypt']);
    const klar = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(P.iv) }, key, b64(P.daten));
    return new TextDecoder().decode(klar);
  }
  async function ableiten(pw) {
    const basis = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
    const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: b64(P.salz), iterations: P.runden }, basis, 256);
    return new Uint8Array(bits);
  }
  function zeige(html) { document.open(); document.write(html); document.close(); }

  // Gespeicherter Schlüssel (gilt nur für diesen Stand der Seite, da das Salz bei jedem Bau neu ist)
  const gespeichert = lies(SPEICHER);
  if (gespeichert) {
    document.documentElement.style.visibility = 'hidden';
    const auto = () => oeffne(b64(gespeichert)).then(zeige).catch(() => { vergiss(SPEICHER); document.documentElement.style.visibility = ''; });
    if (document.readyState === 'complete') auto(); else window.addEventListener('load', () => setTimeout(auto, 0));
  }

  const f = document.getElementById('f'), los = document.getElementById('los'), fehler = document.getElementById('fehler');
  f.addEventListener('submit', async (ev) => {
    ev.preventDefault();
    fehler.textContent = ''; los.disabled = true; los.textContent = 'Wird geöffnet …';
    try {
      const k = await ableiten(document.getElementById('pw').value);
      const html = await oeffne(k);
      merke(SPEICHER, roh(k), document.getElementById('merken').checked);
      zeige(html);
    } catch (e) {
      fehler.textContent = window.crypto && crypto.subtle ? 'Das Passwort stimmt nicht.' : 'Dieser Browser kann die Seite nicht entschlüsseln.';
      los.disabled = false; los.textContent = 'Öffnen';
    }
  });
})();
